name: Electron build

# Packaging pipeline from migration-spec/platform/15-packaging-and-updates.md.
# E2E (Playwright + Electron) is intentionally not run here: it needs a real
# display and an interactive Windows session, so it stays a local/manual gate.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Installs the version pinned by the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build renderer, main and preload
        run: pnpm run build

      # better-sqlite3 ships N-API prebuilds for every platform (win32-x64
      # included), so no per-ABI rebuild is needed. electron-builder still runs
      # its npmRebuild step, which is a no-op for an N-API module.
      - name: Package Windows installer and portable build
        run: pnpm exec electron-builder --win --x64 --publish never

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Name -match '\.(exe|zip)$' } |
            ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } |
            Set-Content release/SHA256SUMS.txt

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: switch-game-catalog-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
