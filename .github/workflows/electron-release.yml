name: Electron build

# Packaging pipeline from docs/platform/15-packaging-and-updates.md.
# E2E (Playwright + Electron) is intentionally not run here: it needs a real
# display and an interactive Windows session, so it stays a local/manual gate.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Installs the version pinned by the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build renderer, main and preload
        run: pnpm run build

      # better-sqlite3 ships N-API prebuilds for every platform (win32-x64
      # included), so no per-ABI rebuild is needed. electron-builder still runs
      # its npmRebuild step, which is a no-op for an N-API module.
      - name: Package portable Windows app
        run: pnpm exec electron-builder --win portable --x64 --publish never

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          & 'release/win-unpacked/NX Library Manager.exe' --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test portable executable
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -Filter '*-portable.exe' -File | Select-Object -First 1
          if (-not $portable) { throw 'Portable executable was not produced' }
          & $portable.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File |
            Where-Object { $_.Name -like '*-portable.exe' } |
            ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } |
            Set-Content release/SHA256SUMS.txt

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*-portable.exe
            release/SHA256SUMS.txt

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: nx-library-manager-windows
          path: |
            release/*-portable.exe
            release/SHA256SUMS.txt
