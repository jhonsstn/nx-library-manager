name: Electron verification

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: Package portable Windows app
        run: pnpm exec electron-builder --win portable --x64 --publish never

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          & 'release/win-unpacked/NX Library Manager.exe' --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test portable executable
        shell: pwsh
        run: |
          $portable = Get-ChildItem release -Filter '*-portable.exe' -File | Select-Object -First 1
          if (-not $portable) { throw 'Portable executable was not produced' }
          & $portable.FullName --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter '*-portable.exe' -File |
            ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } |
            Set-Content release/SHA256SUMS.txt

      - name: Upload portable test build
        uses: actions/upload-artifact@v6
        with:
          name: nx-library-manager-windows-portable
          path: |
            release/*-portable.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
